<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Monte tabelas na tela e gere scripts SQL para MySQL, PostgreSQL e Oracle, sem IA."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>SQLmakerJ</title>
    <script>
      // Aplica o tema salvo antes da primeira pintura, para a tela não piscar.
      try {
        var tema = localStorage.getItem('sqlmaker-tema')
        if (tema === 'claro' || tema === 'escuro') {
          document.documentElement.dataset.tema = tema
        }
      } catch (erro) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
